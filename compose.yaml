services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coderise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coderise}
      POSTGRES_USER: ${POSTGRES_USER:-coderise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coderise_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coderise} -d ${POSTGRES_DB:-coderise}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
